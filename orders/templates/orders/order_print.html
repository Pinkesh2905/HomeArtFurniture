<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Home Art Furniture - Print Invoice {{ order.order_number }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#28513f",
                      "surface-container-low": "#f1f5f9",
                      "on-surface": "#0f172a",
                      "primary-fixed": "#fef3c7",
                      "surface-tint": "#b45309",
                      "surface": "#f8fafc",
                      "on-primary": "#ffffff",
                      "secondary-container": "#cbd5e1",
                      "error": "#b91c1c",
                      "secondary": "#b45309",
                      "primary-container": "#1e293b",
                      "primary": "#0f172a",
                      "tertiary": "#0f766e",
                      "background": "#f8fafc",
                      "secondary-fixed": "#e2e8f0",
              },
              "fontFamily": {
                      "headline-lg": ["Playfair Display", "serif"],
                      "label-caps": ["Inter", "ui-sans-serif"],
                      "headline-md": ["Space Grotesk", "Inter", "ui-sans-serif"],
                      "body-base": ["Inter", "ui-sans-serif"],
                      "body-sm": ["Inter", "ui-sans-serif"],
                      "invoice-accent": ["Space Grotesk", "Inter", "ui-sans-serif"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "1.05", "fontWeight": "800"}],
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.04em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-base": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "1.4", "fontWeight": "400"}],
                      "invoice-accent": ["18px", {"lineHeight": "1.2", "fontWeight": "500"}]
              }
            },
          },
        }
    </script>
    <style>
        @page {
            size: A5 portrait;
            margin: 5mm;
        }
        @media print {
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }

            /* Canvas fills the full A5 page — no forced break after */
            #invoice-canvas, #invoice-canvas-bw {
                border: none !important;
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100% !important;
                height: 200mm !important;           /* A5 height minus 2×5mm margin */
                display: flex !important;
                flex-direction: column !important;
                margin: 0 !important;
                overflow: hidden !important;
                page-break-inside: avoid;
            }
            .FurnitureDimensions-canvas-block {
                border: none !important;
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100% !important;
                height: 200mm !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                margin: 0 !important;
                overflow: hidden !important;
                page-break-inside: avoid;
            }

            /* ---- Header ---- */
            .invoice-canvas-block header { padding: 6px 10px !important; gap: 8px !important; flex-shrink: 0; }
            .invoice-canvas-block header h1 { font-size: 17px !important; line-height: 1.15 !important; margin-bottom: 2px !important; }
            .invoice-canvas-block header p { margin: 0 !important; font-size: 8.5px !important; line-height: 1.35 !important; }
            .invoice-canvas-block header .p-3 { padding: 4px 6px !important; }
            .invoice-canvas-block header .mb-1 { margin-bottom: 1px !important; }
            .invoice-canvas-block header .mb-4 { margin-bottom: 4px !important; }
            .invoice-canvas-block header .mb-2 { margin-bottom: 2px !important; }
            .section-title { font-size: 8px !important; }

            /* ---- Customer / Order grid ---- */
            .invoice-canvas-block section { padding: 0 !important; flex-shrink: 0; }
            .invoice-canvas-block .p-6 { padding: 6px 10px !important; }
            .invoice-canvas-block .p-4 { padding: 5px !important; }
            .invoice-canvas-block .p-3 { padding: 4px !important; }
            .invoice-canvas-block .p-2 { padding: 3px !important; }
            .invoice-canvas-block .gap-10 { gap: 8px !important; }
            .invoice-canvas-block .mb-4 { margin-bottom: 4px !important; }
            .invoice-canvas-block .mb-3 { margin-bottom: 3px !important; }
            .invoice-canvas-block .mb-1 { margin-bottom: 1px !important; }
            .invoice-canvas-block .space-y-3 > * + * { margin-top: 3px !important; }
            .invoice-canvas-block .space-y-1 > * + * { margin-top: 1px !important; }
            .invoice-canvas-block .mt-6 { margin-top: 6px !important; }
            .invoice-topline { height: 5px !important; flex-shrink: 0; }
            .invoice-field-label { font-size: 8px !important; flex: 0 0 58px !important; }
            .invoice-field-value { font-size: 9px !important; min-height: 16px !important; padding-bottom: 2px !important; }
            .invoice-field { gap: 6px !important; }

            /* ---- Items table — grows to fill remaining height ---- */
            .print-items-section {
                flex: 1 1 auto !important;
                min-height: 0 !important;
                overflow: hidden !important;
            }
            .invoice-canvas-block .grid.grid-cols-12 > div { padding: 3px 4px !important; font-size: 9px !important; }

            /* ---- Totals / Summary ---- */
            .invoice-canvas-block .grid.grid-cols-2 .p-2 { padding: 3px 5px !important; font-size: 8.5px !important; }
            .invoice-canvas-block .grid.grid-cols-2 .p-3 { padding: 3px 5px !important; font-size: 8.5px !important; }
            .invoice-canvas-block .font-headline-md { font-size: 13px !important; }
            .invoice-canvas-block .text-\[28px\] { font-size: 14px !important; }
            .invoice-canvas-block .col-span-7 .font-body-base { font-size: 9px !important; }
            .invoice-canvas-block .col-span-7 .font-label-caps { font-size: 7.5px !important; }
            .invoice-canvas-block .rotate-\[-5deg\] { padding: 3px 8px !important; }

            /* ---- Footer ---- */
            .invoice-canvas-block footer { padding: 5px 10px !important; flex-shrink: 0; }
            .invoice-canvas-block footer .gap-8 { gap: 10px !important; }
            .invoice-canvas-block footer .h-12 { height: 22px !important; }
            .invoice-canvas-block footer ol { font-size: 7.5px !important; line-height: 1.4 !important; }
            .invoice-canvas-block footer h3 { font-size: 7.5px !important; margin-bottom: 2px !important; }
            .invoice-canvas-block footer .w-40 { width: 110px !important; }
            .invoice-canvas-block footer span.font-body-sm { font-size: 8px !important; }
            .invoice-canvas-block footer .font-headline-lg { font-size: 15px !important; }
        }
        html {
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }
        
        .paper-bg {
            background-color: #ffffff;
            background-image: url("data:image/svg+xml,%3Csvg width='72' height='72' viewBox='0 0 72 72' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M36 8l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z' fill='%23b45309' fill-opacity='0.02'/%3E%3C/svg%3E");
        }
        .invoice-topline {
            height: 8px;
            background: linear-gradient(90deg, #1e293b, #b45309, #1e293b);
        }
        .invoice-pill {
            border: 1px solid rgba(180, 83, 9, 0.18);
            background: #fef3c7;
            border-radius: 999px;
            padding: 6px 12px;
        }
        .invoice-field {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .invoice-field-label {
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            flex: 0 0 88px;
        }
        .invoice-field-value {
            flex: 1;
            min-height: 24px;
            border-bottom: 1px dotted rgba(30, 41, 59, 0.4);
            color: #0f172a;
            font-weight: 600;
            padding-bottom: 3px;
        }
        .section-title {
            color: #b45309;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-[#f4f1eb] text-[#1f1a17] min-h-screen flex flex-col items-center py-8">

    <!-- Print Controls (Screen Only) -->
    <div class="no-print w-full max-w-[700px] flex justify-between mb-4 px-4">
        <a href="{% url 'order_detail' order.id %}" class="flex items-center gap-2 bg-white text-slate-700 border border-slate-300 px-4 py-2 font-label-caps hover:bg-slate-50 transition-colors">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            BACK TO ORDER
        </a>
        <button class="flex items-center gap-2 bg-primary-container text-white border border-primary px-4 py-2 font-label-caps hover:bg-primary transition-colors" onclick="window.print()">
            <span class="material-symbols-outlined text-[18px]">print</span>
            PRINT INVOICE
        </button>
    </div>

    <!-- PAGE 1: The Invoice Canvas -->
    <div class="w-full max-w-[700px] mx-auto shadow-md relative overflow-hidden mb-8" id="invoice-canvas">
        {% include "orders/invoice_bill_partial.html" %}
    </div>

    <!-- PAGE 2: B&W Invoice Canvas -->
    {% if not original_only %}
    <div class="page-break w-full"></div>
    <div class="w-full max-w-[700px] mx-auto shadow-md relative overflow-hidden mb-8" id="invoice-canvas-bw" style="filter: grayscale(100%);">
        {% include "orders/invoice_bill_partial.html" %}
    </div>
    {% endif %}




</body>
</html>
